server {
    listen ${PORT};
    server_name localhost;

    # Upstream DNS resolution
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # Production reverse proxy for backend API
    location ^~ /api/ {
        proxy_pass https://web-production-357f4.up.railway.app/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name web-production-357f4.up.railway.app;
        
        # Upstream proxy headers
        proxy_set_header Host web-production-357f4.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cookie handling for same-origin proxy
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain web-production-357f4.up.railway.app $host;
        proxy_cookie_path / /;
    }

    # Production reverse proxy for BullMQ admin dashboard
    location ^~ /admin/ {
        proxy_pass https://web-production-357f4.up.railway.app/admin/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name web-production-357f4.up.railway.app;
        
        # Upstream proxy headers
        proxy_set_header Host web-production-357f4.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie handling for same-origin proxy
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain web-production-357f4.up.railway.app $host;
        proxy_cookie_path / /;
    }


    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
